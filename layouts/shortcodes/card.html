{{ $href := .Get "href" }}{{ $fit := .Get "fit" | default "cover" }}
<div class="rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
{{ with $href }}<a href="{{ . }}"{{ if hasPrefix . "http" }} target="_blank" rel="noopener"{{ end }} style="text-decoration: none">{{ end }}
<img src="{{ .Get "image" }}" alt="{{ .Get "title" }}" loading="lazy" class="w-full h-44 {{ if eq $fit "contain" }}object-contain bg-white p-2{{ else }}object-cover{{ end }}" style="margin: 0" />
<div class="p-4">
<div class="text-lg font-semibold dark:text-white">{{ .Get "title" }}</div>
<div class="text-base font-light text-gray-500 dark:text-gray-400">{{ .Get "text" }}</div>
{{ with .Get "link" }}<div class="mt-2 text-base text-yellow-400">{{ . }} &rarr;</div>{{ end }}
</div>
{{ with $href }}</a>{{ end }}
</div>
